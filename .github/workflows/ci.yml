name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Quran/hadith datasets (~35 MB) are downloaded once and cached between runs.
      - uses: actions/cache@v6
        with:
          path: data
          key: deen-data-v1-${{ hashFiles('scripts/fetch-data.mjs') }}
      - run: npm run data

      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Known vulnerabilities in what ships to users
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

  # Browser tests (npm run test:full) drive Microsoft Edge on Windows; run them locally before a release.
