name: Prayer reminders

# Wakes the app so it can send the prayer reminders that are due (Web Push).
#
# WHY ONLY HOURLY: a private repository on GitHub's free plan gets 2,000 Actions minutes a month, and every run costs at least one.
# Every 5 minutes would use about 8,600 a month and GitHub would stop all the jobs. So this is only a backup. The main clock is a
# free timer at cron-job.org that calls the same address every 5 minutes (steps in the control room's to-do list).
# GitHub's scheduler runs "every 5 minutes" at best, and sometimes a few minutes late — the app looks 6 minutes back each time,
# so a reminder is still sent (once) if a run is late. For tighter timing use a free cron service (cron-job.org, 1-minute) to call
# the same address instead, and turn this schedule off.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://deen.example.com        (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable of the app

on:
  schedule:
    - cron: '11 * * * *' # hourly backup only; a free outside timer (cron-job.org) is the main clock, see README
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET secrets are not set — nothing to do."; exit 0; fi
          # Forgive copy-and-paste slips: spaces/line breaks around the values, and a slash at the end of the address.
          APP_URL=$(printf %s "$APP_URL" | tr -d '[:space:]'); APP_URL="${APP_URL%/}"
          CRON_SECRET=$(printf %s "$CRON_SECRET" | tr -d '[:space:]')
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL must start with https:// (it is: $APP_URL)"; exit 1;; esac
          code=$(curl --silent --show-error --max-time 60 -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/push/dispatch" || echo 000)
          echo "HTTP $code from $APP_URL/api/push/dispatch"; head -c 600 out.json 2>/dev/null; echo
          case "$code" in
            200) ;;
            401) echo "::error::The app refused the secret (401). CRON_SECRET in GitHub must be exactly the CRON_SECRET set in Vercel."; exit 1;;
            404) echo "::error::Nothing at that address (404). Check APP_URL."; exit 1;;
            000) echo "::error::Could not reach $APP_URL"; exit 1;;
            *) echo "::error::Unexpected answer: HTTP $code"; exit 1;;
          esac
